name: TripGenie CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/validate_notebooks.py
      - name: Reproduce evaluation without changing committed artifacts
        run: MPLCONFIGDIR=/tmp/tripgenie-mpl python -m backend.evaluation --output artifacts/evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: artifacts/evaluation
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=http://127.0.0.1:5001
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: frontend/build/web
  integration:
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: frontend/build/web
      - name: Start services and exercise the real app
        shell: bash
        run: |
          gunicorn -c backend/gunicorn.conf.py 'backend.app:create_app()' > /tmp/tripgenie-api.log 2>&1 &
          API_PID=$!
          python -m http.server 5173 --bind 127.0.0.1 --directory frontend/build/web > /tmp/tripgenie-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/health && curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/browser_smoke.py --output artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/browser
